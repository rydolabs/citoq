name: CitoQ reproducible repeated Linux netns matrix

on:
  push:
    branches: ["benchmark/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce pinned product baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat benchmarks/BASELINE_COMMIT)"
          test "$BASE" = "08188eba73284dd1069016174ad216f5e02d2cfa"
          test "$(git cat-file -t "$BASE")" = commit
          git diff --exit-code "$BASE" HEAD -- CMakeLists.txt include src python tools tests cmake
      - name: Install reproducible OSS benchmark toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build time iproute2 cyclonedds-dev libfastrtps-dev libfastcdr-dev fastddsgen python3-venv
          python3 -m venv .bench-venv
          .bench-venv/bin/python -m pip install --disable-pip-version-check 'eclipse-zenoh==1.7.1'
          mkdir -p bench-results
          { dpkg-query -W '*cyclonedds*' '*fastrtps*' '*fastcdr*' fastddsgen || true; .bench-venv/bin/python -m pip freeze; uname -a; } > bench-results/DEPENDENCIES.txt
      - name: Build all native comparison drivers
        run: |
          cmake -S benchmarks -B build-bench -G Ninja -DCITOQ_BENCH_FASTDDS=ON
          cmake --build build-bench --parallel 2
      - name: 10 nodes normal link — 3 alternated-order repetitions
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/netns_matrix.py --citoq build-bench/citoq_multi_topic_node --cyclonedds build-bench/cyclonedds_multi_topic_node --fastdds build-bench/fastdds_multi_topic_node --zenoh-python .bench-venv/bin/python --engines citoq cyclonedds fastdds zenoh-peer zenoh-router --nodes 10 --topics 8 --percent 10 --bytes 256 --samples 8 --hz 10 --repeats 3 --profile baseline --lifetime-ms 16000 --output bench-results/n10
      - name: 30 nodes 33 topics normal link — 3 alternated-order repetitions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -x build-bench/fastdds_multi_topic_node; then
            python3 benchmarks/netns_matrix.py --citoq build-bench/citoq_multi_topic_node --cyclonedds build-bench/cyclonedds_multi_topic_node --fastdds build-bench/fastdds_multi_topic_node --zenoh-python .bench-venv/bin/python --engines citoq cyclonedds fastdds zenoh-peer zenoh-router --nodes 30 --topics 33 --percent 10 --bytes 256 --samples 8 --hz 10 --repeats 3 --profile baseline --lifetime-ms 24000 --allow-invalid --output bench-results/n30
          fi
      - name: 10 nodes netem 10Mbps/20ms/1% loss — 2 repetitions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -x build-bench/fastdds_multi_topic_node; then
            python3 benchmarks/netns_matrix.py --citoq build-bench/citoq_multi_topic_node --cyclonedds build-bench/cyclonedds_multi_topic_node --fastdds build-bench/fastdds_multi_topic_node --zenoh-python .bench-venv/bin/python --engines citoq cyclonedds fastdds zenoh-peer zenoh-router --nodes 10 --topics 8 --percent 10 --bytes 256 --samples 8 --hz 10 --repeats 2 --profile impaired --lifetime-ms 18000 --allow-invalid --output bench-results/netem
          fi
      - name: Aggregate all valid and invalid trial rows
        if: always()
        run: |
          python3 benchmarks/summarize.py bench-results
      - name: Preserve reproducible evidence and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citoq-repeated-netns-matrix-${{ github.run_id }}
          path: bench-results/
          if-no-files-found: warn
          retention-days: 30
