name: CitoQ vs Zenoh QUIC mutual TLS public API
on:
  push:
    branches:
      - 'perf/zenoh-quic-mtls-parity-*'
    paths:
      - 'benchmark/**'
      - 'bench/matrix/analyze_zenoh_quic_parity.py'
      - 'include/citoq/detail/linux_request_runtime_driver.hpp'
      - 'include/citoq/native_runtime_c.h'
      - 'src/linux_request_runtime_driver.cpp'
      - 'src/native_runtime_c.cpp'
      - 'python/citoq/native_runtime.py'
      - '.github/workflows/benchmark-zenoh-quic-mtls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver-poll-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Zenoh and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake openssl iproute2 iputils-ping python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'eclipse-zenoh==1.10.1'
          .venv/bin/python -c 'import zenoh; print("Zenoh import OK")'
      - name: Install pinned MsQuic 2.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build CitoQ public C ABI and authenticated native runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF
          cmake --build build-benchmark --target citoq_c citoq_native --parallel 2
          test -s build-benchmark/libcitoq.so
          test -s build-benchmark/libcitoq_native.so
      - name: Create isolated mTLS test identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.217.0.2' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=IP:10.217.0.2' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.217.0.2 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem
      - name: Generate untrusted client CA/identity for negative authentication control
        shell: bash
        run: |
          set -euo pipefail
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout rogue-ca.key -out rogue-ca.pem -subj '/CN=Untrusted Benchmark CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout rogue-client.key \
            -out rogue-client.csr -subj '/CN=Untrusted Benchmark Client' >/dev/null 2>&1
          openssl x509 -req -in rogue-client.csr -CA rogue-ca.pem -CAkey rogue-ca.key \
            -CAcreateserial -out rogue-client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile rogue-ca.pem -purpose sslclient rogue-client.pem
          if openssl verify -CAfile ca.pem -purpose sslclient rogue-client.pem; then
            echo "::error::Rogue client unexpectedly chains to trusted benchmark CA"
            exit 1
          fi
      - name: Compare CitoQ native mTLS-QUIC to Zenoh TCP and Zenoh mTLS-QUIC
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmark/bench_driver.py benchmark/run_comparison.py bench/matrix/analyze_zenoh_quic_parity.py
          python3 -m unittest discover -s benchmark -p 'test_*.py' -v
          for cohort in citoq-quic-mtls zenoh-tcp zenoh-quic-mtls; do
            case "$cohort" in
              citoq-quic-mtls) engine=citoq; zenoh_transport=tcp;;
              zenoh-tcp) engine=zenoh; zenoh_transport=tcp;;
              zenoh-quic-mtls) engine=zenoh; zenoh_transport=quic-mtls;;
            esac
            echo "::group::$cohort"
            status=0
            CITOQ_BENCH_RESOURCES=1 python3 benchmark/run_comparison.py --python "$GITHUB_WORKSPACE/.venv/bin/python" \
              --engines "$engine" --count 200 --rate 100 --repeats 3 --payload 256 \
              --profiles baseline --citoq-poll-mode immediate --citoq-rx-mode event \
              --zenoh-transport "$zenoh_transport" \
              --output-dir "quic-parity-evidence/$cohort" || status=$?
            if [[ "$status" != 0 ]]; then
              echo "::error::Failure in $cohort, raw sender/receiver logs follow"
              find "quic-parity-evidence/$cohort" -maxdepth 1 -name '*.log' -print -exec tail -n 75 {} \;
              exit "$status"
            fi
            echo "::endgroup::"
          done
          python3 bench/matrix/analyze_zenoh_quic_parity.py --root quic-parity-evidence --repeats 3 --payload 256 --rate 100
      - name: Reject QUIC client signed by an untrusted CA
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bench/matrix/check_zenoh_mtls_rejection.py
          status=0
          CITOQ_BENCH_RESOURCES=1 \
            ZENOH_BENCH_ROGUE_CLIENT_CERT="$GITHUB_WORKSPACE/benchmark-certs/rogue-client.pem" \
            ZENOH_BENCH_ROGUE_CLIENT_KEY="$GITHUB_WORKSPACE/benchmark-certs/rogue-client.key" \
            python3 benchmark/run_comparison.py --python "$GITHUB_WORKSPACE/.venv/bin/python" \
              --engines zenoh --zenoh-transport quic-mtls --repeats 1 \
              --count 20 --rate 100 --payload 256 --profiles baseline \
              --output-dir quic-parity-evidence/negative-rogue || status=$?
          if [[ "$status" == 0 ]]; then
            echo "::error::Rogue client unexpectedly passed the QUIC mTLS trial"
            exit 1
          fi
          python3 bench/matrix/check_zenoh_mtls_rejection.py \
            --root quic-parity-evidence/negative-rogue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citoq-zenoh-quic-mtls-parity
          path: quic-parity-evidence/
          if-no-files-found: warn
