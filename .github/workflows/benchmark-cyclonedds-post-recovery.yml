name: CitoQ Zenoh CycloneDDS post-recovery 3-engine matrix
on:
  push:
    branches:
      - 'bench/cyclonedds-post-recovery-*'
    paths:
      - 'benchmark/**'
      - 'bench/matrix/analyze_post_recovery_parity.py'
      - 'include/citoq/detail/linux_request_runtime_driver.hpp'
      - 'include/citoq/native_runtime_c.h'
      - 'src/linux_request_runtime_driver.cpp'
      - 'src/native_runtime_c.cpp'
      - 'python/citoq/native_runtime.py'
      - '.github/workflows/benchmark-cyclonedds-post-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver-poll-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Zenoh and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake openssl iproute2 iputils-ping python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'eclipse-zenoh==1.10.1' 'cyclonedds==11.0.1'
          .venv/bin/python -c 'import zenoh,cyclonedds; print("Zenoh and CycloneDDS imports OK")'
      - name: Install pinned MsQuic 2.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build CitoQ public C ABI and authenticated native runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF
          cmake --build build-benchmark --target citoq_c citoq_native --parallel 2
          test -s build-benchmark/libcitoq.so
          test -s build-benchmark/libcitoq_native.so
      - name: Create isolated mTLS test identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.217.0.2' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=IP:10.217.0.2' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.217.0.2 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem
      - name: Compare 256B CitoQ and Zenoh mTLS QUIC plus CycloneDDS UDP at 100Hz, 1000Hz, 1pct and 2pct loss
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmark/bench_driver.py benchmark/run_comparison.py \
            bench/matrix/analyze_post_recovery_parity.py
          python3 -m unittest discover -s benchmark -p 'test_*.py' -v
          .venv/bin/python -c 'import cyclonedds; print("DDS runtime ready")'
          # DDS is reliable UDP, not mTLS. Only CitoQ/Zenoh form the security-normalized pair.
          for scenario in 256B-100Hz 256B-1000Hz 256B-loss1 256B-loss2; do
            case "$scenario" in
              256B-100Hz)   count=1000; rate=100;  repeats=3; profile=baseline;;
              256B-1000Hz)  count=1000; rate=1000; repeats=3; profile=baseline;;
              256B-loss1)   count=200; rate=100;   repeats=2; profile=netem_10ms_1pct;;
              256B-loss2)   count=200; rate=100;   repeats=2; profile=netem_10ms_2pct;;
            esac
            for cohort in citoq zenoh-quic-mtls cyclonedds-udp; do
              case "$cohort" in
                citoq) engine=citoq;;
                zenoh-quic-mtls) engine=zenoh;;
                cyclonedds-udp) engine=cyclonedds;;
              esac
              echo "::group::$scenario-$cohort"
              # Always collect the full evidence, even when one trial fails;
              # the strict analyzer fails the overall job on ANY invalid run.
              status=0
              CITOQ_BENCH_RESOURCES=1 CITOQ_BENCH_PACING_TRACE=1 \
                python3 benchmark/run_comparison.py \
                --python "$GITHUB_WORKSPACE/.venv/bin/python" \
                --engines "$engine" --count "$count" --rate "$rate" \
                --repeats "$repeats" --payload 256 --profiles "$profile" \
                --citoq-poll-mode immediate --citoq-rx-mode event \
                --zenoh-transport quic-mtls \
                --output-dir "post-recovery-parity-evidence/$scenario/$cohort" || status=$?
              if [[ "$status" != 0 ]]; then
                echo "::warning::Trial failures in $scenario/$cohort, all retained for strict analysis"
                find "post-recovery-parity-evidence/$scenario/$cohort" \
                  -maxdepth 1 -name '*.log' -print -exec tail -n 20 {} \;
              fi
              echo "::endgroup::"
            done
          done
          python3 bench/matrix/analyze_post_recovery_parity.py \
            --root post-recovery-parity-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citoq-zenoh-cyclonedds-post-recovery-matrix
          path: post-recovery-parity-evidence/
          if-no-files-found: warn
