name: CitoQ persistent CTD1 multi-condition regression
on:
  push:
    branches:
      - 'perf/persistent-ctd1-quic-prototype-*'
    paths:
      - 'benchmark/**'
      - 'bench/matrix/analyze_persistent_extended.py'
      - 'src/msquic_request_session_manager.cpp'
      - 'include/citoq/detail/linux_request_runtime_driver.hpp'
      - 'include/citoq/native_runtime_c.h'
      - 'src/linux_request_runtime_driver.cpp'
      - 'src/native_runtime_c.cpp'
      - 'python/citoq/native_runtime.py'
      - '.github/workflows/benchmark-persistent-ctd1-extended.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver-poll-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Zenoh and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake openssl iproute2 iputils-ping python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'eclipse-zenoh==1.10.1'
          .venv/bin/python -c 'import zenoh; print("Zenoh import OK")'
      - name: Install pinned MsQuic 2.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build both public CitoQ binaries from identical source
        shell: bash
        run: |
          set -euo pipefail
          for variant in baseline candidate; do
            if [[ "$variant" == candidate ]]; then
              flag=1
            else
              flag=0
            fi
            cmake -S . -B "build-$variant" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF \
              -DCMAKE_CXX_FLAGS="-DCITOQ_QUIC_PERSISTENT_CTD1=$flag"
            cmake --build "build-$variant" --target citoq_c citoq_native --parallel 2
            test -s "build-$variant/libcitoq.so"
            test -s "build-$variant/libcitoq_native.so"
          done
      - name: Create isolated mTLS test identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.217.0.2' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=IP:10.217.0.2' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.217.0.2 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem
      - name: Strictly compare 64B, 16KiB, 1000Hz and impaired network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile benchmark/bench_driver.py benchmark/run_comparison.py bench/matrix/analyze_persistent_extended.py
          python3 -m unittest discover -s benchmark -p 'test_*.py' -v
          for scenario in size64 size16384 rate1000 loss; do
            case "$scenario" in
              size64) payload=64; rate=100; profile=baseline;;
              size16384) payload=16384; rate=100; profile=baseline;;
              rate1000) payload=256; rate=1000; profile=baseline;;
              loss) payload=256; rate=100; profile=netem_10ms_1pct;;
            esac
            for variant in baseline candidate; do
              echo "::group::$scenario-$variant"
              CITOQ_BENCH_LIBRARY_DIR="$GITHUB_WORKSPACE/build-$variant" CITOQ_BENCH_RESOURCES=1 \
                python3 benchmark/run_comparison.py --python "$GITHUB_WORKSPACE/.venv/bin/python" \
                --engines citoq --count 200 --rate "$rate" --repeats 2 --payload "$payload" \
                --profiles "$profile" --citoq-poll-mode immediate --citoq-rx-mode event \
                --output-dir "persistent-extended/$scenario/$variant"
              echo "::endgroup::"
            done
          done
          python3 bench/matrix/analyze_persistent_extended.py --root persistent-extended --repeats 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citoq-persistent-ctd1-extended
          path: persistent-extended/
          if-no-files-found: warn
