name: Diagnose CitoQ 10ms publish-poll latency
on:
  push:
    branches: ["bench/diagnose-10ms-send-queue-*"]
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-poll-diagnosis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source and install tools
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 08188eba73284dd1069016174ad216f5e02d2cfa^{commit}
          git merge-base --is-ancestor 08188eba73284dd1069016174ad216f5e02d2cfa HEAD
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake openssl iproute2 iputils-ping python3-venv \
            libfastrtps-dev libfastcdr-dev fastddsgen
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'cyclonedds==11.0.1' 'eclipse-zenoh==1.10.1'
          .venv/bin/python -c 'import cyclonedds,zenoh; print("dds and zenoh imports OK")'
      - name: Install pinned MsQuic 2.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build pinned CitoQ native mTLS driver
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF
          cmake --build build-benchmark --target citoq_c citoq_native --parallel 2
          test -s build-benchmark/libcitoq.so
          test -s build-benchmark/libcitoq_native.so
      - name: Create ephemeral mTLS certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.217.0.2' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=IP:10.217.0.2' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.217.0.2 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem
      - name: A-B test poll-before vs poll-after with identical pinned CitoQ
        shell: bash
        run: |
          set -euo pipefail
          for mode in pre post; do
            if [ "$mode" = post ]; then export CITOQ_POLL_AFTER_SEND=1; else export CITOQ_POLL_AFTER_SEND=0; fi
            export CITOQ_BENCH_RUN_LABEL="${mode}-100hz"
            python3 benchmark/run_comparison.py --python "$GITHUB_WORKSPACE/.venv/bin/python" \
              --engines citoq --count 200 --payload 256 --rate 100 --repeats 3 \
              --profiles baseline,netem_10ms_1pct
          done
          unset CITOQ_POLL_AFTER_SEND
          for rate in 50 200; do
            export CITOQ_BENCH_RUN_LABEL="pre-${rate}hz"
            python3 benchmark/run_comparison.py --python "$GITHUB_WORKSPACE/.venv/bin/python" \
              --engines citoq --count 200 --payload 256 --rate "$rate" --repeats 2 \
              --profiles baseline
          done
      - name: Summarize all measured A-B cases
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib,statistics
          root=pathlib.Path("benchmark-evidence")
          for p in sorted(root.glob("*/summary.json")):
              rows=json.loads(p.read_text())
              for profile in sorted({r.get("profile","?") for r in rows}):
                  s=[r for r in rows if r.get("profile")==profile and r.get("accepted")]
                  vals=[r["latency_us_p95"]/1000 for r in s if r.get("latency_us_p95") is not None]
                  print(f"POLL_DIAG mode={p.parent.name} profile={profile} passed={len(s)}/{sum(r.get('profile')==profile for r in rows)} p95_ms={vals} median_p95_ms={statistics.median(vals) if vals else None}",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citoq-poll-ablation-source-pinned-evidence
          path: benchmark-evidence/
          if-no-files-found: warn
