name: Real public APIs: CitoQ mTLS vs DDS Zenoh FastDDS node scaling
on:
  push:
    branches: ['perf/public-api-quic-copy-and-scaling-*']
    paths:
      - 'bench/m26/**'
      - 'bench/matrix/public_discovery*.py'
      - 'bench/matrix/compare_real_apis.py'
      - '.github/workflows/benchmark-real-public-apis.yml'
      - 'src/msquic_request_session_manager.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-public-api-nodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        nodes: [3, 10, 30]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin product and install engines
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 08188eba73284dd1069016174ad216f5e02d2cfa HEAD
          sudo apt-get update
          sudo apt-get install -y cyclonedds-dev cyclonedds-tools libfastrtps-dev libfastcdr-dev fastddsgen g++ ninja-build cmake iproute2 python3 python3-venv time
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check eclipse-zenoh==1.10.1
          mkdir -p evidence10
          dpkg-query -W -f='${Package} ${Version}\n' cyclonedds-dev cyclonedds-tools libfastrtps-dev libfastcdr-dev fastddsgen > evidence10/package-versions.txt
          .venv/bin/pip freeze >> evidence10/package-versions.txt
          uname -a >> evidence10/package-versions.txt
          git rev-parse HEAD >> evidence10/package-versions.txt
      - name: Build three native engines and Zenoh runner
        shell: bash
        run: |
          set -euo pipefail
          cmake -S bench/m26 -B build/bench-m26 -G Ninja
          cmake --build build/bench-m26 --parallel 2
          mkdir -p build/fastgen build/fastdds build/zenoh
          fastddsgen -replace -d "$PWD/build/fastgen" "$PWD/bench/m26/BenchMsg.idl"
          mapfile -t generated < <(find build/fastgen -maxdepth 1 -type f \( -name '*.cxx' -o -name '*.cpp' \) ! -name '*Publisher*' ! -name '*Subscriber*' ! -name '*Main*' | sort)
          test "${#generated[@]}" -ge 2
          g++ -std=c++17 -O2 -pthread -Ibuild/fastgen bench/m26/fastdds_multi_topic_node.cpp "${generated[@]}" -lfastrtps -lfastcdr -o build/fastdds/fastdds_multi_topic_node
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$PWD/.venv/bin/python" "$PWD/bench/m26/zenoh_multi_topic_node.py" > build/zenoh/zenoh_multi_topic_node
          chmod +x build/zenoh/zenoh_multi_topic_node
      - name: Install pinned MsQuic 2.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build pinned CitoQ native mTLS driver
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF
          cmake --build build-benchmark --target citoq_c citoq_native --parallel 2
          test -s build-benchmark/libcitoq.so
          test -s build-benchmark/libcitoq_native.so
      - name: Create ephemeral mTLS certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.202.0.12' >/dev/null 2>&1
          sans="IP:10.202.0.12"
          for i in $(seq 13 41); do sans="$sans,IP:10.202.0.$i"; done
          printf '%s\n' "subjectAltName=$sans" 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.202.0.12 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem

      - name: Verify Python scripts and run real API comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bench/matrix/compare_real_apis.py bench/matrix/public_discovery.py bench/matrix/public_discovery_node.py bench/m26/m26_efficiency.py bench/m26/zenoh_multi_topic_node.py
          python3 bench/matrix/compare_real_apis.py --nodes ${{ matrix.nodes }} --repeats 2 \
            --root "real-api-evidence/n${{ matrix.nodes }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-api-n${{ matrix.nodes }}
          path: real-api-evidence/
          if-no-files-found: warn
