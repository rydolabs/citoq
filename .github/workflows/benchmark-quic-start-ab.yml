name: CitoQ MsQuic start-on-send performance A-B
on:
  push:
    branches:
      - 'perf/quic-send-start-latency-*'
    paths:
      - 'src/msquic_request_session_manager.cpp'
      - 'bench/matrix/analyze_quic_start_ab.py'
      - '.github/workflows/benchmark-quic-start-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-send-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned benchmarks and MsQuic tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake openssl iproute2 iputils-ping python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install 'eclipse-zenoh==1.10.1'
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build both sources from identical commit with single compile-time switch
        shell: bash
        run: |
          set -euo pipefail
          for variant in classic send-start; do
            if [[ "$variant" == classic ]]; then flag=0; else flag=1; fi
            cmake -S . -B "build-benchmark-$variant" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF \
              -DCMAKE_CXX_FLAGS="-DCITOQ_QUIC_START_WITH_SEND=$flag"
            cmake --build "build-benchmark-$variant" --target citoq_c citoq_native --parallel 2
            test -s "build-benchmark-$variant/libcitoq.so"
            test -s "build-benchmark-$variant/libcitoq_native.so"
          done
      - name: Create authenticated mTLS certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.217.0.2' >/dev/null 2>&1
          printf '%s\n' 'subjectAltName=IP:10.217.0.2' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out /tmp/server-check.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.217.0.2 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem
      - name: Run paired CitoQ baseline and START-on-SEND plus Zenoh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bench/matrix/analyze_quic_start_ab.py benchmark/bench_driver.py
          python3 -m unittest discover -s benchmark -p 'test_*.py' -v
          for scenario in 256b-100hz 256b-1000hz 16k-100hz; do
            case "$scenario" in
              256b-100hz) size=256; rate=100; count=200 ;;
              256b-1000hz) size=256; rate=1000; count=400 ;;
              16k-100hz) size=16384; rate=100; count=200 ;;
            esac
            for variant in classic send-start; do
              echo "::group::$scenario $variant"
              CITOQ_BENCH_RESOURCES=1 CITOQ_BENCH_LIBRARY_DIR="$GITHUB_WORKSPACE/build-benchmark-$variant" \
                python3 benchmark/run_comparison.py --python "$GITHUB_WORKSPACE/.venv/bin/python" \
                --engines citoq --count "$count" --rate "$rate" --repeats 3 \
                --payload "$size" --profiles baseline --citoq-poll-mode immediate \
                --citoq-rx-mode event --citoq-rx-wait-ms 10 \
                --output-dir "quic-start-evidence/$scenario/$variant"
              echo "::endgroup::"
            done
            if [[ "$scenario" == 256b-100hz ]]; then
              echo "::group::$scenario Zenoh anchor"
              CITOQ_BENCH_RESOURCES=1 python3 benchmark/run_comparison.py \
                --python "$GITHUB_WORKSPACE/.venv/bin/python" \
                --engines zenoh --count "$count" --rate "$rate" --repeats 3 \
                --payload "$size" --profiles baseline \
                --output-dir "quic-start-evidence/$scenario/zenoh"
              echo "::endgroup::"
            fi
          done
          python3 bench/matrix/analyze_quic_start_ab.py --root quic-start-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quic-start-with-send-ab
          path: quic-start-evidence/
          if-no-files-found: warn
