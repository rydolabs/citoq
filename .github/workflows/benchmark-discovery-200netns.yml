name: CitoQ Issue 53 failed-start cleanup regression
on:
  push:
    branches: ['diagnose/msquic-shutdown-pr31-*', 'fix/msquic-listener-rejection-*', 'diagnose/issue53-stream-census-*', 'fix/msquic-start-complete-failure-*']
    paths:
      - 'bench/matrix/**'
      - 'src/msquic_request_session_manager.cpp'
      - '.github/workflows/benchmark-discovery-200netns.yml'
  pull_request:
    branches: ['fix/msquic-listener-rejection-20261103', 'diagnose/issue53-stream-census-20261104']
    paths:
      - 'bench/matrix/**'
      - 'src/msquic_request_session_manager.cpp'
      - '.github/workflows/benchmark-discovery-200netns.yml'
  workflow_dispatch:
# A/B: common exact-delivery harness only; older runtime lacks diagnostic ACK symbols.
permissions:
  contents: read
jobs:
  public-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - nodes: 10
            profile: baseline
            mode: normal
          - nodes: 30
            profile: netem_10ms_1pct
            mode: normal
          - nodes: 3
            profile: baseline
            mode: blocked
    name: msquic N${{ matrix.nodes }} ${{ matrix.profile }} ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source and install tools
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 08188eba73284dd1069016174ad216f5e02d2cfa^{commit}
          git merge-base --is-ancestor 08188eba73284dd1069016174ad216f5e02d2cfa HEAD
          mkdir -p discovery-scale-evidence/n${{ matrix.nodes }}/${{ matrix.profile }}
          {
            date -u -Is
            git rev-parse HEAD
            uname -a
            nproc
            cat /proc/meminfo | head -6
            ulimit -n
          } > discovery-scale-evidence/n${{ matrix.nodes }}/${{ matrix.profile }}/runner.txt
          sudo -n true
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake openssl iproute2 iputils-ping python3-venv
      - name: Install pinned MsQuic 2.6.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/libm/libmsquic/libmsquic_2.6.1_amd64.deb -o /tmp/libmsquic.deb
          sudo dpkg -i /tmp/libmsquic.deb
          for header in msquic.h msquic_posix.h quic_sal_stub.h; do
            sudo curl -fsSL "https://raw.githubusercontent.com/microsoft/msquic/v2.6.1/src/inc/$header" -o "/usr/local/include/$header"
          done
          SO="$(find /usr/lib /lib -type f -name 'libmsquic.so*' -print -quit)"
          test -n "$SO"
          sudo ln -sf "$SO" /usr/local/lib/libmsquic.so
      - name: Build pinned CitoQ native mTLS driver
        shell: bash
        run: |
          set -euo pipefail
          extra_flags=''
          if [[ '${{ matrix.mode }}' == 'blocked' ]]; then
            extra_flags='-DCITOQ_MSQUIC_TEST_FORCE_BLOCKED_START'
          fi
          cmake -S . -B build-benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release -DCITOQ_ENABLE_MSQUIC=ON -DBUILD_TESTING=OFF "-DCMAKE_CXX_FLAGS=$extra_flags"
          cmake --build build-benchmark --target citoq_c citoq_native --parallel 2
          test -s build-benchmark/libcitoq.so
          test -s build-benchmark/libcitoq_native.so
      - name: Create ephemeral mTLS certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-certs
          cd benchmark-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ca.key -out ca.pem -subj '/CN=CitoQ Benchmark Root' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=10.202.0.12' >/dev/null 2>&1
          sans="IP:10.202.0.12"
          for i in $(seq 13 210); do sans="$sans,IP:10.202.0.$i"; done
          printf '%s\n' "subjectAltName=$sans" 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 1 -extfile server.ext >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj '/CN=CitoQ Benchmark Client' >/dev/null 2>&1
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature' 'extendedKeyUsage=clientAuth' > client.ext
          openssl x509 -req -in client.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out client.pem -days 1 -extfile client.ext >/dev/null 2>&1
          openssl verify -CAfile ca.pem -verify_ip 10.202.0.12 server.pem
          openssl verify -CAfile ca.pem -verify_ip 10.202.0.210 server.pem
          openssl verify -CAfile ca.pem -purpose sslclient client.pem

      - name: Strict public Context discovery, verified netem and exact per-node delivery
        shell: bash
        # Identical A/B 1000-ms probe cadence (legacy-compatible), unchanged exact-delivery gate.
        env:
          CITOQ_BENCH_PASSIVE_READY: '0'
          CITOQ_BENCH_WAIT_QUIC_ACK: '0'
          CITOQ_BENCH_PROBE_INTERVAL_MS: '1000'
          CITOQ_TRACE_MSQUIC_SHUTDOWN: '1'
          CITOQ_TRACE_MSQUIC_HANDLES: '1'
        run: |
          set -euo pipefail
          python3 -m py_compile bench/matrix/public_discovery_scale.py bench/matrix/public_discovery_node.py bench/m26/m26_efficiency.py
          nodes=${{ matrix.nodes }}
          repeats=1
          if [[ '${{ matrix.mode }}' == 'blocked' ]]; then
            # The application must fail strict delivery (no accepted streams).
            # Native close must STILL complete and every failed start be closed.
            rc=0
            python3 bench/matrix/public_discovery_scale.py \
              --nodes "$nodes" --profile '${{ matrix.profile }}' \
              --repeats 1 --count 2 \
              --lifetime-ms 10000 --discovery-timeout-ms 7000 \
              --output 'discovery-scale-evidence/n${{ matrix.nodes }}/${{ matrix.profile }}' || rc=$?
            test "$rc" -ne 0
            python3 - <<'PY'
          from pathlib import Path
          import re
          d = Path('discovery-scale-evidence/n3/baseline/n3-baseline-r1')
          logs = sorted(d.glob('node-*-*.log'))
          assert len(logs) == 3, logs
          for log in logs:
              data = log.read_text(errors='replace')
              assert 'BENCH_PHASE=native_close_done' in data, (log, data[-1200:])
              assert 'phase=registration_close_done' in data, (log, data[-1200:])
          publisher = (d / 'node-000-publisher.log').read_text()
          assert 'CITOQ_MSQUIC_START_FAILED' in publisher, publisher[-3000:]
          snapshots = re.findall(r'CITOQ_MSQUIC_HANDLE_CENSUS phase=registration_close_begin[^\n]+', publisher)
          assert snapshots, publisher[-3000:]
          last = snapshots[-1]
          assert 'stream_without_close=0' in last, last
          assert 'send_without_complete=0' in last, last
          print('EXPECTED_ASYNC_START_FAILURE_CLEANED', last)
          PY
          else
            python3 bench/matrix/public_discovery_scale.py \
              --nodes "$nodes" --profile '${{ matrix.profile }}' \
              --repeats "$repeats" --count 8 \
              --lifetime-ms 105000 --discovery-timeout-ms 90000 \
              --output 'discovery-scale-evidence/n${{ matrix.nodes }}/${{ matrix.profile }}'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: convergence-n${{ matrix.nodes }}-${{ matrix.profile }}
          path: discovery-scale-evidence/n${{ matrix.nodes }}/${{ matrix.profile }}/
          if-no-files-found: warn
