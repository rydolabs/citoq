name: Four-engine pinned Linux netns benchmark
on:
  push:
    branches: ['bench/**']
    paths:
      - '.github/workflows/benchmark-four-engine.yml'
      - 'bench/m26/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-runner-3node-5repeats:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin source and install all four engines
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 08188eba73284dd1069016174ad216f5e02d2cfa^{commit}
          git merge-base --is-ancestor 08188eba73284dd1069016174ad216f5e02d2cfa HEAD
          sudo apt-get update
          sudo apt-get install -y cyclonedds-dev cyclonedds-tools libfastrtps-dev libfastcdr-dev fastddsgen g++ ninja-build cmake iproute2 python3 python3-venv time
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check eclipse-zenoh==1.9.0
          mkdir -p evidence
          dpkg-query -W -f='${Package} ${Version}\n' cyclonedds-dev cyclonedds-tools libfastrtps-dev libfastcdr-dev fastddsgen > evidence/package-versions.txt
          .venv/bin/pip freeze >> evidence/package-versions.txt
          uname -a >> evidence/package-versions.txt
          git rev-parse HEAD >> evidence/package-versions.txt
          printf '%s\n' 'CitoQ source baseline SHA: 08188eba73284dd1069016174ad216f5e02d2cfa' >> evidence/package-versions.txt
      - name: Build CitoQ UDP, CycloneDDS and Fast DDS IDL binaries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S bench/m26 -B build/bench-m26 -G Ninja
          cmake --build build/bench-m26 --parallel 2
          mkdir -p build/fastgen build/fastdds build/zenoh
          fastddsgen -replace -d "$PWD/build/fastgen" "$PWD/bench/m26/BenchMsg.idl"
          mapfile -t generated < <(find build/fastgen -maxdepth 1 -type f \( -name '*.cxx' -o -name '*.cpp' \) ! -name '*Publisher*' ! -name '*Subscriber*' ! -name '*Main*' | sort)
          test "${#generated[@]}" -ge 2
          g++ -std=c++17 -O2 -pthread -Ibuild/fastgen bench/m26/fastdds_multi_topic_node.cpp "${generated[@]}" -lfastrtps -lfastcdr -o build/fastdds/fastdds_multi_topic_node
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$PWD/.venv/bin/python" "$PWD/bench/m26/zenoh_multi_topic_node.py" > build/zenoh/zenoh_multi_topic_node
          chmod +x build/zenoh/zenoh_multi_topic_node
      - name: Unshaped netns 4-engine A/B 5 repetitions
        shell: bash
        run: |
          python3 bench/m26/m26_efficiency.py --cito build/bench-m26/cito_multi_topic_node --dds build/bench-m26/dds_multi_topic_node --zenoh build/zenoh/zenoh_multi_topic_node --fastdds build/fastdds/fastdds_multi_topic_node --engines cito dds zenoh fastdds --nodes 3 --topics 4 --percent 50 --bytes 256 --samples 8 --hz 10 --repeats 5 --lifetime-ms 8500 --profile baseline --output evidence/baseline
      - name: 1Mbps, 50ms, 1% loss netns A/B 5 repetitions
        shell: bash
        run: |
          python3 bench/m26/m26_efficiency.py --cito build/bench-m26/cito_multi_topic_node --dds build/bench-m26/dds_multi_topic_node --zenoh build/zenoh/zenoh_multi_topic_node --fastdds build/fastdds/fastdds_multi_topic_node --engines cito dds zenoh fastdds --nodes 3 --topics 4 --percent 50 --bytes 256 --samples 8 --hz 10 --repeats 5 --lifetime-ms 8500 --profile limited --output evidence/limited
      - name: Validate all 40 cases and consolidate auditable evidence
        shell: bash
        run: |
          python3 bench/m26/summarize.py --root evidence --repeats 5 --nodes 3
          cat evidence/COMPARISON.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citoq-cyclonedds-zenoh-fastdds-all-evidence
          path: evidence/
